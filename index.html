    <!-- Polyfill and guard for window.fetch setter in iframe & extension environments -->
    <script>
      (function() {
        try {
          var originalFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : null;
          var _fetchHandler = originalFetch;

          // Define getter and setter on window so scripts assigning window.fetch do not throw
          try {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() {
                return _fetchHandler;
              },
              set: function(fn) {
                _fetchHandler = fn;
              }
            });
          } catch (e1) {}

          // Also patch Window.prototype if configurable
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              var desc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
              if (desc && !desc.set && desc.configurable) {
                Object.defineProperty(Window.prototype, 'fetch', {
                  configurable: true,
                  enumerable: true,
                  get: function() {
                    return _fetchHandler;
                  },
                  set: function(fn) {
                    _fetchHandler = fn;
                  }
                });
              }
            }
          } catch (e2) {}
        } catch (e) {}

        // Suppress any non-critical getter error from external wrappers
        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.indexOf('Cannot set property fetch') !== -1) {
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
            if (typeof event.preventDefault === 'function') {
              event.preventDefault();
            }
            return true;
          }
        }, true);
      })();
    </script>
